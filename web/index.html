<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
// The public GitHub Pages copy has moved to the sangha site.
if (location.hostname.endsWith("github.io")) location.replace("https://yantramedi.app/web/");
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yantra</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05040a">
<style>html,body{margin:0;height:100%;background:#05040a}</style>
</head>
<body>
<script>
// The web edition loads the same yantra page the desktop app serves, then adds
// web.js in place of the Python server.
fetch("../index.html", { cache: "no-store" })
  .then((response) => response.text())
  .then((html) => {
    html = html
      .replace("<head>", [
        "<head>",
        '<link rel="manifest" href="manifest.webmanifest">',
        '<link rel="icon" href="icons/icon.svg" type="image/svg+xml">',
        '<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">',
        '<meta name="apple-mobile-web-app-capable" content="yes">',
        '<meta name="mobile-web-app-capable" content="yes">',
        '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">',
        '<meta name="apple-mobile-web-app-title" content="Yantra">',
        '<script src="offer.js"><\/script>',
        '<script src="practice.js"><\/script>',
        '<script src="settings.js"><\/script>',
        '<script src="profile.js"><\/script>',
        '<script src="quotes.js"><\/script>',
        '<script src="talks.js"><\/script>',
        '<script src="resources.js"><\/script>',
        '<script src="account.js"><\/script>',
        '<script src="web.js"><\/script>',
        '<script type="module" src="reminders.js"><\/script>',
      ].join("\n"))
      .replace(
        '"Name each file with its track title, then install it in Music/yantra/" + disc.id + "."',
        '"This disc is not on Spotify or Apple Music. It plays from your own copies in the desktop app."'
      )
      .replace('"The installed tracks play in album order."', '""');
    document.open();
    document.write(html);
    document.close();
  })
  .catch(() => {
    document.body.style.cssText = "color:#f3e6c8;font:16px Georgia,serif;display:grid;place-items:center";
    document.body.textContent = "The yantra did not load. Refresh to try again.";
  });
</script>
</body>
</html>
